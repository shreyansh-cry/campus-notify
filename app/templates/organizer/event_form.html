{% extends "base.html" %}
{% block title %}{{ 'Edit' if event else 'New' }} Event — CampusNotify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <a href="{{ url_for('organizer.dashboard') }}" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i>Back to dashboard
        </a>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">
                    <i class="bi bi-{{ 'pencil' if event else 'plus-circle' }} text-primary me-2"></i>
                    {{ 'Edit Event' if event else 'Create New Event' }}
                </h3>

                <form method="POST" action="{{ url_for('organizer.edit_event', event_id=event.id) if event else url_for('organizer.create_event') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="title" class="form-label fw-medium">Event Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title"
                               value="{{ event.title if event else '' }}" required maxlength="200"
                               placeholder="e.g. Intro to Machine Learning Workshop">
                    </div>

                    <div class="mb-3">
                        <label for="club_name" class="form-label fw-medium">Club / Organization <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="club_name" name="club_name"
                               value="{{ event.club_name if event else '' }}" required maxlength="100"
                               placeholder="e.g. AI Club">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-medium">Description</label>
                        <textarea class="form-control" id="description" name="description"
                                  rows="4" maxlength="2000"
                                  placeholder="Tell students what to expect...">{{ event.description if event else '' }}</textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="event_date" class="form-label fw-medium">Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="event_date" name="event_date"
                                   value="{{ event.event_date.strftime('%Y-%m-%d') if event and event.event_date else '' }}" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="event_time" class="form-label fw-medium">Time (IST)</label>
                            <input type="time" class="form-control" id="event_time" name="event_time"
                                   value="{{ event.event_time.strftime('%H:%M') if event and event.event_time else '' }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="location" class="form-label fw-medium">Location</label>
                        <input type="text" class="form-control" id="location" name="location"
                               value="{{ event.location if event else '' }}" maxlength="200"
                               placeholder="e.g. Room 301, CS Building">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="saveEventBtn">
                            <i class="bi bi-check-lg me-1"></i>{{ 'Save Changes' if event else 'Create Event' }}
                        </button>
                        {% if event %}
                            <a href="{{ url_for('organizer.event_detail', event_id=event.id) }}"
                               class="btn btn-outline-secondary">Cancel</a>
                        {% else %}
                            <a href="{{ url_for('organizer.dashboard') }}"
                               class="btn btn-outline-secondary">Cancel</a>
                        {% endif %}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
